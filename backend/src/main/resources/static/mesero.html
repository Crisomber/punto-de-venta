<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Punto de Venta — Mesero</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script>(function () { if (localStorage.getItem('pos.tema') === 'oscuro') { document.documentElement.classList.add('oscuro'); } })();</script>
</head>
<body class="app">
<div class="barra-tema">
    <button type="button" class="boton-tema" id="btn-tema">Modo oscuro</button>
    <div class="menu-usuario">
        <button type="button" class="boton-menu-usuario" id="btn-menu-usuario" aria-haspopup="true" aria-expanded="false">
            <span class="avatar-usuario" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
            </span>
            <span class="flecha-menu" aria-hidden="true">▾</span>
        </button>
        <div class="dropdown-usuario" id="dropdown-usuario" role="menu">
            <p class="dropdown-usuario-nombre" id="nombre-usuario"></p>
            <p class="dropdown-usuario-rol">Mesero</p>
            <hr>
            <button type="button" class="boton-secundario dropdown-usuario-salir" id="btn-salir">Cerrar sesión</button>
        </div>
    </div>
</div>
<div class="app-shell">
    <div class="barra">
        <h1>Mesero</h1>
    </div>

    <div id="vista-mesas">
        <div class="panel">
            <h2>Mesas</h2>
            <div class="rejilla-mesas" id="grid-mesas"></div>
        </div>

        <div class="panel">
            <h2>Para llevar</h2>
            <button class="boton-primario" id="btn-nueva-para-llevar">Nueva orden para llevar</button>
            <ul class="lista-simple" id="lista-para-llevar" style="margin-top:16px"></ul>
        </div>

        <p class="error" id="error-mesas"></p>
    </div>

    <div id="vista-orden" class="oculto">
        <button class="boton-secundario" id="btn-volver">← Volver a mesas</button>

        <div class="venta-layout" style="margin-top:16px">
            <section class="panel" id="panel-agregar-platillos" style="flex:999 1 560px;min-width:0">
                <h2>Agregar platillos</h2>
                <div class="fila-form">
                    <div style="flex:1">
                        <label for="orden-buscar">Buscar platillo</label>
                        <input type="text" id="orden-buscar" placeholder="Buscar…">
                    </div>
                </div>
                <div class="tabs tabs-categorias" id="orden-tabs-categorias" style="margin-top:12px"></div>
                <div class="grid-platillos" id="orden-grid-platillos" style="margin-top:16px"></div>
            </section>

            <aside class="panel panel-ticket">
                <h2 id="titulo-orden"></h2>

                <div id="bloque-pendiente">
                    <h3 style="margin:0 0 10px">Por agregar</h3>
                    <ul class="lista-simple" id="lista-pendiente"></ul>
                    <p class="vacio" id="pendiente-vacio">Toca un platillo para agregarlo.</p>
                    <button type="button" class="boton-primario" id="btn-agregar-a-orden" style="width:100%;margin-top:10px" disabled>Agregar a la orden</button>
                    <p class="error" id="error-agregar"></p>
                    <hr style="margin:20px 0;border:none;border-top:1px solid var(--color-borde)">
                </div>

                <h3 style="margin:0 0 10px">En la orden</h3>
                <ul class="lista-simple" id="lista-items"></ul>

                <div style="margin-top:16px;display:flex;gap:10px">
                    <button class="boton-primario oculto" id="btn-enviar" style="flex:1">Enviar a cocina</button>
                    <button class="boton-primario oculto" id="btn-cerrar" style="flex:1">Cerrar cuenta</button>
                </div>
                <p class="error" id="error-orden"></p>
            </aside>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/mesero.js"></script>
</body>
</html>
