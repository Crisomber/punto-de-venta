<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Punto de Venta — Caja</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script>(function () { if (localStorage.getItem('pos.tema') === 'oscuro') { document.documentElement.classList.add('oscuro'); } })();</script>
</head>
<body class="app">
<div class="barra-tema">
    <button type="button" class="boton-tema" id="btn-tema">Modo oscuro</button>
</div>
<div class="app-shell">
    <div class="barra">
        <h1>Caja — <span id="nombre-usuario"></span></h1>
        <button class="boton-secundario" id="btn-salir">Cerrar sesión</button>
    </div>

    <div id="vista-pendientes">
        <div class="panel">
            <h2>Cuentas pendientes de cobro</h2>
            <div style="display:flex;gap:8px;margin-bottom:16px">
                <button class="boton-secundario" id="btn-actualizar">Actualizar</button>
                <button class="boton-primario" id="btn-nueva-venta">+ Nueva venta</button>
            </div>
            <ul class="lista-simple" id="lista-pendientes"></ul>
        </div>
        <p class="error" id="error-pendientes"></p>
    </div>

    <div id="vista-menu" class="oculto">
        <button class="boton-secundario" id="btn-volver-menu">← Volver</button>
        <div class="venta-layout" style="margin-top:16px">
            <section class="panel" style="flex:999 1 560px;min-width:0">
                <h2>Nueva venta</h2>
                <div class="fila-form">
                    <div style="flex:1">
                        <label for="venta-buscar">Buscar platillo</label>
                        <input type="text" id="venta-buscar" placeholder="Buscar…">
                    </div>
                </div>
                <div class="tabs" id="tabs-categorias" style="margin-top:12px;overflow-x:auto"></div>
                <div class="grid-platillos" id="grid-platillos" style="margin-top:16px"></div>
            </section>
            <aside class="panel panel-ticket">
                <h2>Venta directa</h2>
                <ul class="lista-simple" id="lista-ticket"></ul>
                <p class="vacio" id="ticket-vacio">Sin platillos todavía.</p>
                <div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:700">
                    <span>Total</span><span>$<span id="ticket-total">0.00</span></span>
                </div>
                <div style="display:flex;gap:10px;margin-top:16px">
                    <button class="boton-secundario" id="btn-cancelar-venta" style="flex:1">Cancelar</button>
                    <button class="boton-primario" id="btn-cobrar-venta" style="flex:2" disabled>Cobrar</button>
                </div>
                <p class="error" id="error-venta"></p>
            </aside>
        </div>
    </div>

    <div id="vista-cobro" class="oculto">
        <button class="boton-secundario" id="btn-volver">← Volver</button>
        <div class="panel" style="margin-top:16px">
            <h2 id="titulo-cobro"></h2>
            <ul class="lista-simple" id="lista-items-cobro"></ul>
            <p style="font-weight:600;margin-top:12px">Total estimado: $<span id="total-estimado"></span></p>
        </div>
        <div class="panel" id="panel-metodo">
            <h2>Método de pago</h2>
            <div class="fila-form">
                <label><input type="radio" name="metodo" value="EFECTIVO" checked style="width:auto"> Efectivo</label>
                <label><input type="radio" name="metodo" value="TARJETA" style="width:auto"> Tarjeta</label>
                <button class="boton-primario" id="btn-confirmar-cobro" style="margin-left:16px">Confirmar cobro</button>
            </div>
            <p class="error" id="error-cobro"></p>
        </div>

        <div class="panel oculto" id="panel-recibo">
            <h2>Recibo</h2>
            <p id="recibo-detalle"></p>
            <ul class="lista-simple" id="recibo-items"></ul>
            <p style="font-weight:600;margin-top:12px">Monto cobrado: $<span id="recibo-monto"></span> (<span id="recibo-metodo"></span>)</p>
            <button class="boton-primario" id="btn-listo" style="margin-top:12px">Listo</button>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/caja.js"></script>
</body>
</html>
